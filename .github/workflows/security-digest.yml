name: Security Digest Agent

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  security-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: .seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run Security Digest Agent
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python security_digest_agent.py

      - name: Save seen items cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .seen_items.json
          key: seen-items-${{ github.run_id }}
