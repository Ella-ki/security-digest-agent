name: Security Digest Agent

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

jobs:
  security-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore seen items cache
        uses: actions/cache@v5
        with:
          path: .seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser deep-translator==1.11.4

      - name: Run Security Digest Agent
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python security_digest_agent.py

      # public 레포는 60일간 커밋이 없으면 스케줄이 자동 비활성화되므로 매 실행마다 재활성화
      - name: Keep workflow alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/security-digest.yml/enable"

      - name: Save seen items cache
        if: always()
        uses: actions/cache@v5
        with:
          path: .seen_items.json
          key: seen-items-${{ github.run_id }}
